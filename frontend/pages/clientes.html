<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Pro | Clientes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                </div>
                <h1>TechFix Pro</h1>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Inicio</span></a></li>
                <li><a href="clientes.html" class="nav-link active"><i class="fas fa-users"></i><span>Clientes</span></a></li>
                <li><a href="servicios.html" class="nav-link"><i class="fas fa-tools"></i><span>Servicios</span></a></li>
                <li><a href="cotizaciones.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i><span>Cotizaciones</span></a></li>
                <li><a href="reportes.html" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-users"></i>
                    Gestión de Clientes
                </h3>
                <div>
                    <button class="btn btn-secondary btn-sm" onclick="exportarClientes()">
                        <i class="fas fa-download"></i> Exportar CSV
                    </button>
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="fas fa-plus"></i> Nuevo Cliente
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th width="120">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p><i class="fas fa-code"></i> TechFix Pro © 2025</p>
    </footer>

    <!-- MODAL CLIENTE -->
    <div id="modal-form" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-title">
                    <i class="fas fa-user-plus"></i>
                    Nuevo Cliente
                </h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="form-data" onsubmit="event.preventDefault(); guardar();">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label required">Nombre / Empresa</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required">Teléfono</label>
                            <input type="text" id="telefono" class="form-control" placeholder="6000-0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Dirección</label>
                        <textarea id="direccion" class="form-control" rows="2" placeholder="Dirección (opcional)"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/clientes.js"></script>
</body>
</html>
