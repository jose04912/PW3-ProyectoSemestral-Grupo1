<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Pro | Cotizaciones</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                </div>
                <h1>TechFix Pro</h1>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Inicio</span></a></li>
                <li><a href="clientes.html" class="nav-link"><i class="fas fa-users"></i><span>Clientes</span></a></li>
                <li><a href="servicios.html" class="nav-link"><i class="fas fa-tools"></i><span>Servicios</span></a></li>
                <li><a href="cotizaciones.html" class="nav-link active"><i class="fas fa-file-invoice-dollar"></i><span>Cotizaciones</span></a></li>
                <li><a href="reportes.html" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-file-invoice-dollar"></i>
                    Cotizaciones
                </h3>
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> Nueva Cotización
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nº Cotización</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Subtotal</th>
                            <th>Impuesto</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th width="140">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p><i class="fas fa-code"></i> TechFix Pro © 2025</p>
    </footer>

    <!-- MODAL COTIZACIÓN -->
    <div id="modal-form" class="modal-overlay">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-title">
                    <i class="fas fa-file-invoice-dollar"></i>
                    Nueva Cotización
                </h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="form-data" onsubmit="event.preventDefault(); guardar();">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required">Cliente</label>
                            <select id="id_cliente" class="form-control" required>
                                <option value="">Seleccione un cliente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label required">Fecha</label>
                            <input type="date" id="fecha_cotizacion" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Estado</label>
                            <select id="estado" class="form-control">
                                <option value="pendiente">Pendiente</option>
                                <option value="aprobada">Aprobada</option>
                                <option value="rechazada">Rechazada</option>
                                <option value="completada">Completada</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h4><i class="fas fa-list"></i> Servicios</h4>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="agregarItem()">
                                <i class="fas fa-plus"></i> Agregar Servicio
                            </button>
                        </div>
                        <div id="items-container" class="quote-items"></div>
                    </div>

                    <div class="quote-totals">
                        <div class="quote-total-row">
                            <span>Subtotal:</span>
                            <span id="total-subtotal" class="mono">$0.00</span>
                        </div>
                        <div class="quote-total-row">
                            <span>ITBMS (8%):</span>
                            <span id="total-impuesto" class="mono">$0.00</span>
                        </div>
                        <div class="quote-total-row grand-total">
                            <span>Total:</span>
                            <span id="total-total">$0.00</span>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label class="form-label">Notas adicionales</label>
                        <textarea id="notas" class="form-control" rows="2" placeholder="Observaciones..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL VER COTIZACIÓN -->
    <div id="modal-ver" class="modal-overlay">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="modal-ver-title" class="modal-title">
                    <i class="fas fa-file-invoice"></i>
                    Detalle de Cotización
                </h3>
                <button class="modal-close" onclick="closeModalVer()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-ver-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="exportarDetalle()">
                    <i class="fas fa-download"></i> Exportar CSV
                </button>
                <button class="btn btn-primary" onclick="closeModalVer()">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/cotizaciones.js"></script>
</body>
</html>
