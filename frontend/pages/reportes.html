<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Pro | Reportes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                </div>
                <h1>TechFix Pro</h1>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Inicio</span></a></li>
                <li><a href="clientes.html" class="nav-link"><i class="fas fa-users"></i><span>Clientes</span></a></li>
                <li><a href="servicios.html" class="nav-link"><i class="fas fa-tools"></i><span>Servicios</span></a></li>
                <li><a href="cotizaciones.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i><span>Cotizaciones</span></a></li>
                <li><a href="reportes.html" class="nav-link active"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-chart-bar"></i>
                    Reporte de Cotizaciones
                </h3>
                <button class="btn btn-primary" onclick="exportarCSV()">
                    <i class="fas fa-file-csv"></i> Exportar a CSV
                </button>
            </div>

            <!-- Filtros -->
            <div class="filters">
                <div class="filter-group">
                    <label>Cliente</label>
                    <select id="filtro-cliente" class="form-control" onchange="cargarReporte()">
                        <option value="">Todos los clientes</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Fecha desde</label>
                    <input type="date" id="filtro-fecha-desde" class="form-control" onchange="cargarReporte()">
                </div>
                <div class="filter-group">
                    <label>Fecha hasta</label>
                    <input type="date" id="filtro-fecha-hasta" class="form-control" onchange="cargarReporte()">
                </div>
                <div class="filter-group" style="justify-content: flex-end;">
                    <label>&nbsp;</label>
                    <button class="btn btn-secondary" onclick="limpiarFiltros()">
                        <i class="fas fa-eraser"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Tabla de reporte -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nº Cotización</th>
                            <th>Cliente</th>
                            <th>Subtotal</th>
                            <th>Impuesto</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                    <tfoot>
                        <tr id="tabla-totales" style="background: var(--bg-input); font-weight: bold;">
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p><i class="fas fa-code"></i> TechFix Pro © 2025</p>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
