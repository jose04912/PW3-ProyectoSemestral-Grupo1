version: '3.8'

services:
  # Servidor Web Apache con PHP
  web:
    image: php:8.2-apache
    container_name: freelance_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    command: >
      bash -c "docker-php-ext-install mysqli pdo pdo_mysql && apache2-foreground"
    networks:
      - freelance_network

  # Base de datos MariaDB
  db:
    image: mariadb:10.11
    container_name: freelance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: freelance_db
      MYSQL_USER: freelance_user
      MYSQL_PASSWORD: freelance123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - freelance_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: freelance_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: freelance_user
      PMA_PASSWORD: freelance123
    depends_on:
      - db
    networks:
      - freelance_network

networks:
  freelance_network:
    driver: bridge

volumes:
  db_data:

  
